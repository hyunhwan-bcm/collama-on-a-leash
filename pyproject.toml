[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collama-on-a-leash"
version = "0.2.0"
description = "Colab llama.cpp orchestration through google-colab-cli"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
collama = "collama_on_a_leash.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
